server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip compression for text-like assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Hashed assets (Vite emits <name>-<hash>.<ext>) are immutable — cache
  # aggressively. Requests for them carry a query string (?t=...) so a catch-all
  # on assets would ignore fingerprinting; rely on the strong immutable cache.
  location ~* \.(?:js|mjs|cjs|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html revalidates on every visit so new deploys take effect immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # SPA fallback: unknown paths serve index.html so client-side routes
  # (e.g. /login, /products) don't 404 on refresh/direct navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
